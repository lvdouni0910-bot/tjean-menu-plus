<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chi tiết món · TJean Menu+</title><link rel="stylesheet" href="/assets/app.css"></head><body><main class="app"><header class="top"><a class="back" href="javascript:history.back()">← Quay lại</a><div class="badge" data-owner>Khách</div></header><div id="content"><div class="empty">Đang tải...</div></div><nav class="bottom"><a class="nav" href="/">⌂<br>Menu+</a><a class="nav on" href="/recipes/">⌕<br>Tìm món</a><a class="nav" href="/updates/">＋<br>Món mới</a><a class="nav" href="/my/">♙<br>Của tôi</a></nav></main><script src="/assets/app.js"></script><script>(async()=>{const slug=qs('slug');if(!slug){content.innerHTML='<div class="empty">Không tìm thấy món</div>';return}try{const j=await api('/api/recipes?slug='+encodeURIComponent(slug)),r=j.recipes[0];if(!r){content.innerHTML='<div class="empty">Không tìm thấy món</div>';return}fetch('/api/view',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:r.id})}).catch(()=>{});if(r.locked){content.innerHTML=`<div class="detailHero">${r.image_url?`<img src="${r.image_url}" alt="">`:r.emoji||'🍽️'}</div><section class="section"><span class="new">MENU+ OWNER</span><h1>${r.name}</h1><p class="muted">${r.people||''}</p><div class="lockbox"><h2>🔒 Công thức dành cho chủ sở hữu</h2><p class="muted">Kích hoạt Menu+ để xem nguyên liệu, từng bước và thông số chính xác theo model của bạn.</p><a class="primary" href="/activate/?next=${encodeURIComponent(location.pathname+location.search)}">Kích hoạt để xem →</a></div></section>`;return}let p=r.params?Object.entries(r.params).find(([k,v])=>v):null;content.innerHTML=`<div class="detailHero">${r.image_url?`<img src="${r.image_url}" alt="">`:r.emoji||'🍽️'}</div><section class="section"><span class="new">${r.update_month||'TJean Menu+'}</span><h1>${r.name}</h1><p class="muted">${r.people||''}</p>${p?`<h2>Thông số · ${p[0]}</h2><div class="specs"><div class="spec"><b>Chế độ</b><br>${p[1].mode}</div><div class="spec"><b>Nhiệt độ</b><br>${p[1].temp}</div><div class="spec"><b>Thời gian</b><br>${p[1].time}</div><div class="spec"><b>Vị trí</b><br>${p[1].rack}</div></div>`:'<div class="notice">Món này chưa có thông số phù hợp với model đã kích hoạt.</div>'}<h2>Nguyên liệu</h2><ul class="list">${(r.ingredients||[]).map(x=>`<li>${x}</li>`).join('')}</ul><h2>Cách làm</h2>${(r.steps||[]).map((x,i)=>`<div class="step"><span class="num">${i+1}</span><div>${x}</div></div>`).join('')}<div class="notice">Thông số là điểm khởi đầu đã được chuẩn hóa; kích thước thực phẩm và nhiệt độ ban đầu có thể làm thời gian thay đổi nhẹ. Luôn kiểm tra thực phẩm đã chín an toàn trước khi dùng.</div></section>`}catch(e){content.innerHTML='<div class="empty">Không thể tải công thức</div>'}})()</script></body></html>
