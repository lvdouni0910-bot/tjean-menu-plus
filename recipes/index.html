<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Công thức · TJean Menu+</title><link rel="stylesheet" href="/assets/app.css"></head><body><main class="app"><header class="top"><a class="back" href="/">← Menu+</a><div class="badge" data-owner>Khách</div></header><section class="section"><h1>Tất cả công thức</h1><p class="muted">Tìm món phù hợp với bữa ăn hôm nay</p><input id="search" class="search" placeholder="Tìm món..."><div id="cats" class="cats"><button class="chip on" data-c="all">Tất cả</button><button class="chip" data-c="viet">Món Việt</button><button class="chip" data-c="hap">Hấp</button><button class="chip" data-c="nuong">Nướng</button><button class="chip" data-c="banh">Làm bánh</button><button class="chip" data-c="healthy">Healthy</button></div><div id="cards" class="cards"></div></section><nav class="bottom"><a class="nav" href="/">⌂<br>Menu+</a><a class="nav on" href="/recipes/">⌕<br>Tìm món</a><a class="nav" href="/updates/">＋<br>Món mới</a><a class="nav" href="/my/">♙<br>Của tôi</a></nav></main><script src="/assets/app.js"></script><script>let all=[],cat='all';function render(){let q=search.value.toLowerCase();let x=all.filter(r=>(cat==='all'||r.categories?.includes(cat))&&r.name.toLowerCase().includes(q));cards.innerHTML=x.map(card).join('')||'<div class="empty">Không tìm thấy món phù hợp</div>'}document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-c]').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.c;render()});search.oninput=render;(async()=>{try{all=(await api('/api/recipes')).recipes;render()}catch(e){cards.innerHTML='<div class="empty">Không thể tải công thức</div>'}})()</script></body></html>
