<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Menu+ Update · TJean</title><link rel="stylesheet" href="/assets/app.css"></head><body><main class="app"><header class="top"><a class="back" href="/">← Menu+</a><div class="badge" data-owner>Khách</div></header><section class="section"><span class="new">MENU+ UPDATE</span><h1 style="margin-top:8px">Món mới mỗi tháng</h1><p class="muted">Mỗi lần cập nhật đều được lưu lại. Chọn một tháng để xem các món mới.</p><div id="months"></div></section><nav class="bottom"><a class="nav" href="/">⌂<br>Menu+</a><a class="nav" href="/recipes/">⌕<br>Tìm món</a><a class="nav on" href="/updates/">＋<br>Món mới</a><a class="nav" href="/my/">♙<br>Của tôi</a></nav></main><script src="/assets/app.js"></script><script>(async()=>{try{const j=await fetch('/api/months').then(r=>r.json());months.innerHTML=(j.months||[]).map((m,i)=>`<a class="month" href="/updates/month.html?month=${m.month}"><div><span class="new">${i===0?'MỚI NHẤT':'ARCHIVE'}</span><div><strong>${m.month}</strong></div></div><div><b>+${m.count} món</b><br><span class="muted">Xem →</span></div></a>`).join('')||'<div class="empty">Chưa có bản cập nhật</div>'}catch{months.innerHTML='<div class="empty">Không thể tải lịch sử cập nhật</div>'}})()</script></body></html>
