<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TJean Menu+ 后台</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f2ee;color:#222}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button,.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700}.tabs .on,.btn{background:#222;color:#fff}.panel{background:#fff;border-radius:18px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,textarea,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;font:inherit}textarea{min-height:90px}.list{display:grid;gap:10px}.item{border:1px solid #eee;border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:12px}.muted{color:#777;font-size:13px}.danger{background:#fff0ee;color:#a22}.image-tools{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:14px 0}.image-preview{width:130px;height:100px;object-fit:cover;border-radius:12px;background:#f7f3eb;border:1px solid #eee}.image-tools input{max-width:300px}.image-tools button{padding:10px;border:1px solid #ddd;border-radius:9px;cursor:pointer}.hide{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.item{display:block}.top{display:block}}</style></head><body><div class="wrap"><div class="top"><div><h1>TJean Menu+ 运营后台</h1><div class="muted">菜谱新增/编辑/发布 · 月度更新 · 订单授权</div></div><input id="key" placeholder="后台密钥" style="max-width:320px"></div><div class="tabs"><button class="on" data-t="recipes">菜谱</button><button data-t="codes">订单授权</button></div><section id="recipes"><div class="panel"><h2 id="formTitle">新增菜谱</h2><input id="rid" type="hidden"><div class="grid"><label>菜名<input id="name"></label><label>Slug<input id="slug" placeholder="ga-nuong-mat-ong"></label><label>Emoji<input id="emoji" value="🍽️"></label><label>人数<input id="people"></label><label>分类（逗号）<input id="categories" placeholder="viet,nuong"></label><label>更新月份<input id="month" type="month"></label><label>状态<select id="status"><option value="draft">草稿</option><option value="published">已发布</option></select></label><label>免费<select id="free"><option value="false">机主专属</option><option value="true">免费</option></select></label></div><div class="image-tools"><img id="imagePreview" class="image-preview" alt="菜谱图片预览" hidden><label>菜谱图片（JPG、PNG、WebP，最大 4 MB）<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"></label><button type="button" id="removeImage" class="danger" hidden>删除已上传图片</button></div><label>食材（每行一项）<textarea id="ingredients"></textarea></label><label>步骤（每行一步）<textarea id="steps"></textarea></label><label>机型参数 JSON<textarea id="params" placeholder='{"UBaker S1":{"mode":"Steam + Bake","temp":"180°C","time":"45 phút","rack":"Tầng 2"}}'></textarea></label><p><button class="btn" id="save">保存菜谱</button> <button id="reset">清空</button></p><div id="msg" class="muted"></div></div><div class="panel"><h2>菜谱列表</h2><div id="recipeList" class="list"></div></div></section><section id="codes" class="hide"><div class="panel"><h2>添加订单授权</h2><p class="muted">订单号就是客户的 Menu+ 激活码。可单条添加，也可批量粘贴。批量格式：每行“平台,订单号,机型”。</p><div class="grid"><label>平台<select id="orderPlatform"><option>TikTok</option><option>Shopee</option></select></label><label>订单号<input id="orderNumber" placeholder="例如 5768493021"></label><label>机型<select id="orderModel"><option>AirChef X1</option><option>ShellBake S1</option><option>Dolphin S1</option><option>LumiBake S1 Pro</option><option>UBaker S1</option><option>ShellBake S2</option><option>JoyBake</option></select></label></div><p><button class="btn" id="addOrder">添加订单</button></p><hr style="border:0;border-top:1px solid #eee;margin:20px 0"><h3>批量导入</h3><textarea id="batchOrders" placeholder="TikTok,5768493021,ShellBake S1
Shopee,250923ABC123,UBaker S1"></textarea><p><button class="btn" id="importOrders">批量导入</button></p><div id="orderMsg" class="muted"></div></div><div class="panel"><h2>订单授权列表</h2><div id="codeList" class="list"></div></div></section></div><script>
const $=id=>document.getElementById(id);let data=[],imagePreviewUrl=null;
function clearPreview(){if(imagePreviewUrl)URL.revokeObjectURL(imagePreviewUrl);imagePreviewUrl=null;$('imagePreview').hidden=true;$('imagePreview').removeAttribute('src')}
function showPreview(blob){clearPreview();imagePreviewUrl=URL.createObjectURL(blob);$('imagePreview').src=imagePreviewUrl;$('imagePreview').hidden=false}
$('imageFile').onchange=()=>{const file=$('imageFile').files[0];if(file){if(file.size>4*1024*1024){$('msg').textContent='图片不能超过 4 MB';$('imageFile').value='';return}showPreview(file)}};
async function showSavedImage(r){clearPreview();$('removeImage').hidden=!r.image_url;if(!r.image_url)return;try{const response=await fetch(r.image_url,{headers:{'x-admin-key':$('key').value}});if(response.ok&&String($('rid').value)===String(r.id)&&!$('imageFile').files.length)showPreview(await response.blob())}catch{}}
$('removeImage').onclick=async()=>{const id=$('rid').value;if(!id)return;try{const r=await fetch('/api/recipe-image?id='+encodeURIComponent(id),{method:'DELETE',headers:{'x-admin-key':$('key').value}});const j=await r.json();if(!r.ok)throw Error(j.error||'删除失败');$('imageFile').value='';clearPreview();$('removeImage').hidden=true;$('msg').textContent='图片已删除';loadRecipes()}catch(e){$('msg').textContent='错误：'+e.message}};
function headers(){return {'content-type':'application/json','x-admin-key':$('key').value}};async function api(url,opt={}){opt.headers={...(opt.headers||{}),...headers()};let r=await fetch(url,opt),j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j}
async function loadRecipes(){try{data=(await api('/api/admin/recipes')).recipes; $('recipeList').innerHTML=data.map(r=>`<div class="item"><div><b>${r.emoji||''} ${r.name}</b><div class="muted">${r.status} · ${r.update_month||'非月度新增'} · ${r.free?'免费':'专属'}</div></div><div><button onclick="edit(${r.id})">编辑</button> <button class="danger" onclick="delR(${r.id})">删除</button></div></div>`).join('')||'暂无数据'}catch(e){$('recipeList').textContent='输入正确后台密钥后点击“菜谱”刷新：'+e.message}}
function edit(id){let r=data.find(x=>x.id==id);$('rid').value=r.id;$('name').value=r.name;$('slug').value=r.slug;$('emoji').value=r.emoji||'';$('people').value=r.people||'';$('categories').value=(r.categories||[]).join(',');$('month').value=r.update_month||'';$('status').value=r.status;$('free').value=String(r.free);$('ingredients').value=(r.ingredients||[]).join('\n');$('steps').value=(r.steps||[]).join('\n');$('params').value=JSON.stringify(r.params||{},null,2);$('formTitle').textContent='编辑菜谱 #'+id;$('imageFile').value='';showSavedImage(r);scrollTo({top:0,behavior:'smooth'})}
function reset(){['rid','name','slug','people','categories','month','ingredients','steps','params'].forEach(x=>$(x).value='');$('emoji').value='🍽️';$('status').value='draft';$('free').value='false';$('formTitle').textContent='新增菜谱';$('imageFile').value='';$('removeImage').hidden=true;clearPreview()}
$('save').onclick=async()=>{try{let b={name:$('name').value,slug:$('slug').value,emoji:$('emoji').value,people:$('people').value,categories:$('categories').value.split(',').map(x=>x.trim()).filter(Boolean),update_month:$('month').value||null,status:$('status').value,free:$('free').value==='true',ingredients:$('ingredients').value.split('\n').filter(Boolean),steps:$('steps').value.split('\n').filter(Boolean),params:JSON.parse($('params').value||'{}')};let id=$('rid').value;const saved=await api('/api/admin/recipes'+(id?'?id='+id:''),{method:id?'PUT':'POST',body:JSON.stringify(b)});id=saved.recipe?.id||id;$('rid').value=id;const file=$('imageFile').files[0];if(file){if(file.size>4*1024*1024)throw Error('图片不能超过 4 MB');const upload=await fetch('/api/recipe-image?id='+encodeURIComponent(id),{method:'POST',headers:{'x-admin-key':$('key').value,'content-type':file.type},body:file});const result=await upload.json();if(!upload.ok)throw Error('菜谱已保存，但图片上传失败：'+(result.error||'请重试'));}$('msg').textContent='保存成功';reset();loadRecipes()}catch(e){$('msg').textContent='错误：'+e.message}}
async function delR(id){if(confirm('确定删除？')){await api('/api/admin/recipes?id='+id,{method:'DELETE'});loadRecipes()}};$('reset').onclick=reset;
async function loadCodes(){try{let a=(await api('/api/admin/codes')).codes;$('codeList').innerHTML=a.map(c=>`<div class="item"><div><b>${c.platform} · ${c.order_number}</b><div class="muted">${c.model}</div></div><div>${c.used_at?'已激活 · '+(c.owner||''):'未激活'}${!c.used_at?` <button class="danger" onclick="delOrder('${c.platform}','${String(c.order_number).replace(/'/g,"\\'")}')">删除</button>`:''}</div></div>`).join('')||'<div class="muted">暂无订单授权</div>'}catch(e){$('codeList').textContent=e.message}}
async function addOrders(orders){try{let j=await api('/api/admin/codes',{method:'POST',body:JSON.stringify({orders})});$('orderMsg').textContent=`成功新增 ${j.added} 条，跳过重复 ${j.skipped} 条${j.errors?.length?'；错误：'+j.errors.join('；'):''}`;loadCodes()}catch(e){$('orderMsg').textContent='错误：'+e.message}}
$('addOrder').onclick=()=>addOrders([{platform:$('orderPlatform').value,orderNumber:$('orderNumber').value.trim(),model:$('orderModel').value}]);
$('importOrders').onclick=()=>{let orders=$('batchOrders').value.split(/\r?\n/).filter(Boolean).map(x=>{let [platform,orderNumber,model]=x.split(',').map(v=>v.trim());return{platform,orderNumber,model}});addOrders(orders)};
window.delOrder=async(platform,orderNumber)=>{if(!confirm('确认删除这个未激活订单？'))return;try{await api('/api/admin/codes',{method:'DELETE',body:JSON.stringify({platform,orderNumber})});loadCodes()}catch(e){alert(e.message)}};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('recipes').classList.toggle('hide',b.dataset.t!=='recipes');$('codes').classList.toggle('hide',b.dataset.t!=='codes');b.dataset.t==='recipes'?loadRecipes():loadCodes()});$('key').onchange=()=>loadRecipes();loadRecipes();
</script></body></html>
